<div class="page-search" data-page-search hidden>
  <div class="page-search__bar">
    <img
      src="{{ get_asset_url('../../public/icons/icon-search.svg') }}"
      alt=""
      aria-hidden="true"
      width="16"
      height="16"
    />
    <input
      type="text"
      class="page-search__input"
      data-page-search-input
      placeholder="{{ module.placeholder }}"
      autocomplete="off"
      aria-label="{{ module.placeholder }}"
    />
    <span class="page-search__count" data-page-search-count>0/0</span>
    <button
      type="button"
      class="page-search__nav"
      data-page-search-prev
      aria-label="Resultado anterior"
    >
      <img
        src="{{ get_asset_url('../../public/icons/icon-arrow-down.svg') }}"
        alt=""
        aria-hidden="true"
        class="page-search__nav-icon page-search__nav-icon--up"
      />
    </button>
    <button
      type="button"
      class="page-search__nav"
      data-page-search-next
      aria-label="Próximo resultado"
    >
      <img
        src="{{ get_asset_url('../../public/icons/icon-arrow-down.svg') }}"
        alt=""
        aria-hidden="true"
        class="page-search__nav-icon"
      />
    </button>
    <button
      type="button"
      class="page-search__close"
      data-page-search-close
      aria-label="Fechar busca"
    >
      <img
        src="{{ get_asset_url('../../public/icons/icon-modal-close.svg') }}"
        alt=""
        aria-hidden="true"
      />
    </button>
  </div>
</div>

{{ require_css(get_asset_url('./module.css')) }} {{
require_js(get_asset_url('./module.js'), { "position": "footer" }) }}
