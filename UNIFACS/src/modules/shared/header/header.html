<header class="site-header">
  <div class="institutional-header">
    <!-- No Figma da UNIFACS, a logo já vem como uma única imagem
             combinada (ícone + "UNIFACS" + "Excelência Acadêmica
             Einstein"), igual à UAM. A mesma imagem serve todos os
             breakpoints, só mudando de altura via CSS. -->
    <a
      href="/UNIFACS/src/pages/"
      class="institutional-header__brand"
      aria-label="Página inicial UNIFACS"
    >
      <img
        src="/UNIFACS/src/public/images/shared/unifacs-header-logo.png"
        alt="UNIFACS — Excelência Acadêmica Einstein"
        width="1175"
        height="192"
      />
    </a>

    <nav
      class="institutional-header__nav"
      id="institutional-nav"
      aria-label="Navegação institucional"
    >
      <div class="institutional-header__link">Sou Candidato</div>
      <span class="institutional-header__divider" aria-hidden="true"></span>
      <button
        type="button"
        class="institutional-header__search"
        data-search-trigger
        aria-label="Buscar nesta página"
      >
        <img
          src="/UNIFACS/src/public/icons/icon-search-blue.svg"
          alt=""
          aria-hidden="true"
          width="16"
          height="16"
        />
      </button>
      <div class="header-cta-dropdown" data-dropdown>
        <button
          type="button"
          class="btn btn-primary header-cta-dropdown__trigger"
          data-dropdown-trigger
          aria-expanded="false"
          aria-haspopup="true"
        >
          <span class="header-cta-dropdown__trigger-full"
            >Inscreva-se para 2027.1</span
          >
          <span class="header-cta-dropdown__trigger-short">Inscreva-se</span>
          <img
            src="/UNIFACS/src/public/icons/icon-arrow-down-white.svg"
            alt=""
            aria-hidden="true"
            class="header-cta-dropdown__chevron"
            width="16"
            height="16"
          />
        </button>
        <div class="header-cta-dropdown__menu" data-dropdown-menu>
          <div class="header-cta-dropdown__menu-inner">
            <a class="header-cta-dropdown__item" href="https://fichainscricao.inspirali.com/concurso/18503">Transferência Externa 27.1</a>
            <a class="header-cta-dropdown__item" href="https://fichainscricao.inspirali.com/concurso/18438">Certificações Internacionais 27.1</a>
            <a class="header-cta-dropdown__item" href="https://fichainscricao.inspirali.com/concurso/18447">Processo Enem 27.1</a>
            <a class="header-cta-dropdown__item" href="https://fichainscricao.inspirali.com/concurso/18430">Portador de Diploma 27.1</a>
            <a class="header-cta-dropdown__item" href="https://www.unifacs.br/inscreva/18421">Destrancamento Medicina 27.1</a>
          </div>
        </div>
      </div>
    </nav>
  </div>

  <button
    type="button"
    class="institutional-header__mobile-search"
    data-search-trigger
    aria-label="Buscar nesta página"
  >
    <span class="institutional-header__mobile-search-placeholder"
      >O que você procura?</span
    >
    <span class="institutional-header__mobile-search-btn">
      <img
        src="/UNIFACS/src/public/icons/icon-search-blue.svg"
        alt=""
        aria-hidden="true"
        width="16"
        height="16"
      />
    </span>
  </button>

  <nav class="course-nav" aria-label="Navegação do curso">
    <div class="course-nav__list">
      <a class="course-nav__link" href="#processos-seletivos"
        >Editais e Resultados</a
      >
      <a class="course-nav__link" href="#nosso-dna">Diferenciais</a>
      <a class="course-nav__link" href="#matriz-curricular"
        >Matriz Curricular</a
      >
      <a class="course-nav__link" href="#nossos-campus">Nossos Campus</a>
      <a class="course-nav__link" href="#metodologia">Ensino e Prática</a>
      <a class="course-nav__link" href="#investimento-e-financiamentos"
        >Bolsas e Financiamentos</a
      >
      <a class="course-nav__link" href="#grupo-inspirali">Inspirali</a>
      <a
        class="course-nav__link"
        href="https://umapenca.com/lojamedunifacs/"
        target="_blank"
        rel="noopener"
        >Loja</a
      >
    </div>
  </nav>
</header>
