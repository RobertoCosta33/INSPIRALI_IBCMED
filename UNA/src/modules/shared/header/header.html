               "Excelência Acadêmica Einstein") já vem como uma única imagem
               combinada — diferente da UAM, onde cada peça é um elemento
               separado (SVG + texto + divisor + PNG do Einstein). Por isso
               aqui não há `__subtitle`/`__divider`/`__einstein` nem a
               duplicata `__brand-mobile`: a mesma imagem serve todos os
               breakpoints, só mudando de tamanho via CSS. -->
          <a href="/UNA/src/pages/" class="institutional-header__brand" aria-label="Página inicial UNA">
