<section class="section section--tint-strong institutional-about" id="sobre-a-anhembi-morumbi" aria-labelledby="institutional-about-title">
  <div class="institutional-about__video">
    <img
      class="institutional-about__video-image"
      src="{{ module.video_cover_image.src }}"
      alt="{{ module.video_cover_image.alt }}"
      loading="lazy"
    />
    <a
      class="institutional-about__video-play"
      href="{{ module.video_url.url.href }}"
      target="_blank"
      rel="noopener"
      aria-label="Assistir ao vídeo institucional da Anhembi Morumbi"
    >
      <img src="{{ get_asset_url('../../public/icons/icon-youtube-play-button.png') }}" alt="" aria-hidden="true" />
    </a>
  </div>

  <div class="institutional-about__content">
    <div class="institutional-about__intro">
      <p class="eyebrow">{{ module.eyebrow }}</p>
      <h2 class="institutional-about__title" id="institutional-about-title">{{ module.title }}</h2>
    </div>
    <div class="institutional-about__text">{{ module.body_text }}</div>
    <a class="institutional-about__cta" href="{{ module.cta_url.url.href }}" target="_blank" rel="noopener">
      {{ module.cta_label }}
      <img src="{{ get_asset_url('../../public/icons/icon-arrow-right-outline-teal.svg') }}" alt="" aria-hidden="true" width="24" height="24" />
    </a>
  </div>
</section>

{{ require_css(get_asset_url('./module.css')) }}
